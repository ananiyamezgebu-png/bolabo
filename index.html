<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>የተዋሕዶ መዝሙራት | Ethiopian Orthodox Mezmur</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 30px 16px 50px; color: #fff4dc;
      font-family: Georgia, "Times New Roman", serif;
      background: radial-gradient(circle at top, rgba(174,119,39,.2), transparent 38%),
                  linear-gradient(135deg, #160e08, #432b17 55%, #1c1009);
    }
    header { text-align: center; margin: 10px auto 35px; }
    .cross { color: #f4d27f; font-size: 54px; text-shadow: 0 0 18px #b8860b; }
    h1 { color: #f5d477; font-size: clamp(25px, 5vw, 40px); margin: 8px 0; }
    .subtitle { color: #e9d8b8; font-size: 18px; }
    .section { width: min(1000px, 100%); margin: 38px auto 0; }
    .section-title { color: #f5d477; text-align: center; font-size: clamp(22px, 4vw, 30px); margin-bottom: 8px; }
    .section-desc { text-align: center; color: #d9c6a4; font: 14px/1.6 Arial, sans-serif; margin: 0 auto 22px; }
    .creator-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
    .creator-card, .add-card {
      min-height: 180px; padding: 22px; text-align: center; border-radius: 17px;
      background: rgba(47,29,15,.92); border: 1px solid #c9a34b;
      box-shadow: 0 10px 28px rgba(0,0,0,.25);
    }
    .creator-icon { font-size: 35px; margin-bottom: 9px; }
    .creator-card h3 { color: #ffe2a0; margin: 4px 0 9px; overflow-wrap: anywhere; }
    .creator-card p { color: #d9c6a4; font: 13px Arial, sans-serif; overflow-wrap: anywhere; }
    .channel-link, .action-btn {
      display: inline-block; border: 0; cursor: pointer; text-decoration: none;
      padding: 10px 17px; border-radius: 22px; color: #2b1b0b;
      background: linear-gradient(135deg, #ffe6a3, #d3a23e); font: bold 13px Arial, sans-serif;
      margin-top: 8px;
    }
    .channel-link:hover, .action-btn:hover { filter: brightness(1.1); }
    .add-card { border-style: dashed; }
    .add-card h3 { color: #ffe2a0; margin-top: 0; }
    .creator-form { display: grid; gap: 10px; }
    .creator-form input {
      width: 100%; padding: 12px; border-radius: 9px; border: 1px solid #b99142;
      background: #21150d; color: #fff4dc; font: 14px Arial, sans-serif; outline: none;
    }
    .creator-form input:focus { border-color: #ffe2a0; box-shadow: 0 0 0 2px rgba(255,226,160,.15); }
    .creator-form input::placeholder { color: #bca98b; }
    .remove-btn { background: transparent; border: 1px solid #9e654c; color: #e7b8a4; border-radius: 18px; padding: 7px 12px; cursor: pointer; margin: 10px 4px 0; }
    .back {
      display: inline-block; margin-top: 30px; padding: 12px 22px; color: #2b1b0b;
      background: linear-gradient(135deg, #ffe6a3, #d3a23e); border-radius: 25px;
      text-decoration: none; font: bold 14px Arial, sans-serif;
    }
    .center { text-align: center; }
    .note { width: min(760px, 100%); margin: 24px auto 0; color: #d8c7a9; font: 13px/1.6 Arial, sans-serif; text-align: center; }
    .status { min-height: 18px; color: #f5d477; font: 13px Arial, sans-serif; text-align: center; }
  </style>
</head>
<body>
  <header>
    <div class="cross" aria-hidden="true">☦</div>
    <h1>BOLABO</h1>
    <p class="subtitle" lang="am"></p>
  </header>

  <main>
    <section class="section" aria-labelledby="memihiran-title">
      <h2 class="section-title" id="memihiran-title">BOLABO</h2>
      <p class="section-desc">.</p>

      <div class="creator-grid" id="creatorGrid">
        <div class="add-card">
          <div class="creator-icon">✝</div>
          <h3>Add a Memihir / YouTuber</h3>
          <form class="creator-form" id="creatorForm">
            <input id="creatorName" type="text" placeholder="Memihir or YouTuber name" required maxlength="70">
            <input id="channelUrl" type="url" placeholder="YouTube channel URL (https://...)" required>
            <button class="action-btn" type="submit">＋ Add Channel</button>
          </form>
          <p class="status" id="formStatus" aria-live="polite"></p>
        </div>
      </div>
      <p class="note">Tap “Watch Videos” to open YouTube search results for that teacher or channel. Add your own channel with its YouTube URL.</p>
    </section>
  </main>

  <script>
    const grid = document.getElementById('creatorGrid');
    const form = document.getElementById('creatorForm');
    const nameInput = document.getElementById('creatorName');
    const urlInput = document.getElementById('channelUrl');
    const status = document.getElementById('formStatus');
    const STORAGE_KEY = 'orthodoxMemihiranChannels';

    // These cards open YouTube search results for the named teacher/channel.
    // This avoids sending visitors to an unverified or incorrect channel URL.
    const featuredChannels = [
      { name: 'መምህር እዮብ ይመኑ', search: 'መምህር እዮብ ይመኑ ትምህርት' },
      { name: 'መምህር ምህረትአብ አሰፋ', search: 'መምህር ምህረትአብ አሰፋ ትምህርት' },
      { name: 'ዲያቆን ሄኖክ ኃይሌ', search: 'ዲያቆን ሄኖክ ኃይሌ ትምህርት' },
      { name: 'መምህር አድነው ወንድሙ', search: 'መምህር አድነው ወንድሙ ትምህርት' },
      { name: 'መምህር ዘበነ ለማ', search: 'መምህር ዘበነ ለማ ትምህርት' },
      { name: 'መምህር ያረጋል አበጋዝ', search: 'መምህር ያረጋል አበጋዝ ትምህርት' },
      { name: 'Mahtot Tube', search: 'Mahtot Tube Ethiopian Orthodox' },
      { name: 'Mahibere Kidusan (MK TV)', search: 'Mahibere Kidusan MK TV' },
      { name: 'MEBA TV', search: 'MEBA TV Ethiopian Orthodox' },
      { name: '21 MEDIA', search: '21 MEDIA Ethiopian Orthodox' },
      { name: 'Nisebiho Mezmur', search: 'Nisebiho Mezmur' },
      { name: 'Finote Tsidk', search: 'Finote Tsidk Ethiopian Orthodox' }
    ];

    function renderFeaturedChannels() {
      featuredChannels.forEach(channel => {
        const card = document.createElement('article');
        card.className = 'creator-card';
        const icon = document.createElement('div');
        icon.className = 'creator-icon';
        icon.textContent = '☦';
        const title = document.createElement('h3');
        title.textContent = channel.name;
        const description = document.createElement('p');
        description.textContent = 'Ethiopian Orthodox Tewahedo';
        const link = document.createElement('a');
        link.className = 'channel-link';
        link.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(channel.search);
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = '▶ Watch Videos';
        card.append(icon, title, description, link);
        grid.insertBefore(card, grid.firstChild);
      });
    }

    function getChannels() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
        return Array.isArray(saved) ? saved.filter(item => item && typeof item.name === 'string' && typeof item.url === 'string') : [];
      } catch (error) {
        return [];
      }
    }

    function saveChannels(channels) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(channels));
        return true;
      } catch (error) {
        status.textContent = 'Your browser blocked saving. The channel may disappear after you close this page.';
        return false;
      }
    }

    function makeChannelCard(channel, index) {
      const card = document.createElement('article');
      card.className = 'creator-card';
      const icon = document.createElement('div');
      icon.className = 'creator-icon';
      icon.textContent = '☦';
      const title = document.createElement('h3');
      title.textContent = channel.name;
      const description = document.createElement('p');
      description.textContent = 'Ethiopian Orthodox Tewahedo channel';
      const link = document.createElement('a');
      link.className = 'channel-link';
      link.href = channel.url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = '▶ Visit YouTube Channel';
      const remove = document.createElement('button');
      remove.className = 'remove-btn';
      remove.type = 'button';
      remove.textContent = 'Remove';
      remove.addEventListener('click', () => {
        const channels = getChannels();
        channels.splice(index, 1);
        saveChannels(channels);
        renderChannels();
      });
      card.append(icon, title, description, link, remove);
      return card;
    }

    function renderChannels() {
      grid.querySelectorAll('.creator-card').forEach(card => card.remove());
      getChannels().forEach((channel, index) => {
        grid.insertBefore(makeChannelCard(channel, index), grid.firstChild);
      });
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const name = nameInput.value.trim();
      let url;
      try { url = new URL(urlInput.value.trim()); }
      catch { status.textContent = 'Please enter a valid YouTube channel URL.'; return; }
      if (!['youtube.com', 'www.youtube.com', 'm.youtube.com', 'youtu.be', 'www.youtu.be'].includes(url.hostname)) {
        status.textContent = 'Please enter a YouTube link.';
        return;
      }
      const channels = getChannels();
      channels.push({ name, url: url.href });
      const saved = saveChannels(channels);
      renderChannels();
      form.reset();
      if (saved) status.textContent = 'Channel added successfully!';
    });

    renderFeaturedChannels();
    renderChannels();
  </script>
</body>
</html>
